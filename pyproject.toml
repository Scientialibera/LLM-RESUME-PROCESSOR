[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-resume-processor"
version = "0.2.0"
description = "Deterministic Azure OpenAI resume-processing pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "azure-cosmos>=4.7,<5",
  "azure-identity>=1.19,<2",
  "openai>=2.0,<3",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
